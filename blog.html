s treats text as a bag of meaning-bearing tokens. A word is positive or negative based on its dictionary entry or its co-occurrence statistics in a labeled corpus. This works reasonably well for product reviews and long-form opinion pieces. It fails systematically on microblogging, where texts are short, ironic, and saturated with pragmatic cues that survive only in sound and rhythm, not in semantics.\n\nThe thesis was built on a different premise: **the phonological shape of a word is not arbitrary**. The sounds authors choose carry emotional loading that is independent of — and sometimes opposed to — the word's semantic content. This phenomenon is called **phonaesthesia**, and the recurring sound-meaning associations it produces are called **phonaesthemes**.\n\nA phonaestheme is not a morpheme. It carries no grammatical function and no stable dictionary meaning. Yet *gl-* words in English (glimmer, gleam, glow, glisten) cluster persistently around visual brightness and positive affect. The *sl-* cluster (slime, slump, slouch, slug) leans negative, heavy, and unpleasant. Readers feel this before they process the meaning — and writers reach for these sounds *because* of that pre-semantic resonance.\n\nMy research asked: **do phonaesthemes exist in Spanish? Can they be extracted systematically from microblogging corpora? And can they be used to predict the polarity of a tweet — that is, to infer whether the author is expressing something positive, negative, or neutral?**\n\n## The Emotional Layer: What Feeling Leaves Behind in Language\n\nPhonetic signals capture one dimension of what the author reveals involuntarily. Emotional signals capture another. The thesis developed a complementary feature layer based on three emotional dimensions drawn from psycholinguistic research:\n\n- **Valence** — the positive-to-negative axis of an emotional state.\n- **Arousal** — the degree of activation or intensity associated with the emotion.\n- **Dominance** — the sense of control or power relative to the emotional situation.\n\nThese three dimensions — the VAD model — encode emotional nuance that binary positive/negative labels collapse. A tweet expressing fear (low valence, high arousal, low dominance) and a tweet expressing sadness (low valence, low arousal, low dominance) both read as \"negative\" in standard sentiment classifiers. They feel entirely different to a human reader, and they differ in the phonetic and lexical choices the author makes.\n\nThe thesis built a Spanish affective lexicon adapted to the vocabulary of social media — including abbreviations, neologisms, emojis, and code-switching — and integrated it into the polarity prediction pipeline alongside the phonaesthetic features.\n\n## What Words Say About You\n\nThe phonaesthetic layer of the model answers a specific question: *what does the author's word choice at the level of sound reveal about their emotional state?*\n\nThe methodology proceeded in three steps. First, Spanish tweets were transcribed phonetically using a rule-based engine adapted for the phonological variation found in Colombian, Mexican, and Iberian Spanish — the dominant varieties in the training corpora. Second, phoneme clusters at word onset, coda, and nucleus positions were extracted and mapped to emotional valence distributions derived from annotated data. Third, these phonaesthetic vectors were integrated into a hybrid feature representation alongside morphosyntactic and lexical features.\n\nThe model was validated on benchmark tasks from **PAN@CLEF 2019 and 2020** — international shared tasks on author profiling, fake profile detection, and bot identification. The phonaesthetic features improved polarity prediction most significantly on texts where lexical evidence was sparse: short tweets, texts with high rates of slang and abbreviation, and messages where irony inverted the apparent semantic polarity.\n\n## What Emotions Say About You\n\nThe emotional feature layer answers the complementary question: *what does the author's emotional signature reveal about their identity and community?*\n\nOne of the most consistent findings of the thesis was that **authors are emotionally coherent across their posting histories**. A user who writes angry tweets on Monday is more likely to write angry tweets on Friday — not because the news is consistently bad, but because individual emotional baselines are stable. Incorporating this prior — using a user's historical emotional profile as a regularization signal for per-tweet prediction — reduced false positive rates for ironic and sarcastic texts substantially.\n\nThis finding has implications beyond sentiment analysis. It suggests that **polarity prediction and author profiling are not independent tasks**: knowing who is writing helps predict what the text means, and knowing what a text means helps characterize who wrote it. The thesis modeled both directions jointly, which is one of its central methodological contributions.\n\n## From the PhD to the Lab\n\nNone of the work ended at the thesis defense. The phonaesthetic feature pipeline is now the text processing backbone of **Apollo**, the open-source multimodal AI package developed at the VerbaNexAI lab. The emotional dimensionality framework directly informs **MentalGuard**, the project for early mental health risk detection in university students, where distinguishing fear from sadness from anhedonia is clinically meaningful. The user-level emotional consistency model influenced the author profiling components of the **TrueShield** fake news detection platform.\n\nThe thesis also produced a published record that preceded and accompanied it: the *Cognitive Computation* paper on sociolinguistic features for community detection (2021, 19 citations), the PAN@CLEF system papers from 2019 and 2020, and the earlier work on automatic corpus construction for Spanish that made the entire feature extraction pipeline possible.\n\n## What I Now Understand About Language\n\nSeven years of building models that listen to the sounds of words and the shape of emotions have left me with a conviction I did not start with: **language is not primarily a vehicle for transmitting information**. It is primarily a vehicle for projecting identity and managing affect. The information transmission is secondary — almost incidental.\n\nThis has practical consequences for NLP. Models that treat text as a sequence of meaning units will always be systematically fooled by the ways people use language to signal solidarity, perform identity, express irony, and navigate social position. Models that incorporate the full repertoire of signals — phonetic, prosodic, lexical, syntactic, emotional, social-contextual — come closer to what a skilled human reader does when they understand not just what a tweet says, but what it says about the person who wrote it.\n\nThat is, ultimately, what the thesis was about: building machines that listen the way people do.\n\n---\n\n*Edwin Puertas, PhD, is Associate Professor and Program Director of the Doctoral and Master's Programs in Systems Engineering at the Technological University of Bolívar (UTB), Cartagena, Colombia. IEEE Senior Member. He leads the VerbaNexAI research group, working on NLP, author profiling, and multimodal AI.*\n\n*The full thesis is available in the institutional repository of the Pontificia Universidad Javeriana.*\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"c\":[\"\",\"blog\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"blog\",{\"children\":[\"__PAGE__\",{}]}]},\"$undefined\",\"$undefined\",16],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/0znoxqx8bhaua.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}],[\"$\",\"link\",\"1\",{\"rel\":\"stylesheet\",\"href\":\"/_next/static/chunks/13knj569t0z7~.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\ ls are useful, but they serve different downstream tasks. Brand monitoring, for instance, benefits from polarity; mental health screening requires a much richer emotional profile.\n\n## Linguistic features that go beyond the lexicon\n\nPure lexicon-based methods plateau quickly on microblogs. Several complementary feature families help bridge the gap:\n\n### Phonaesthetic and phonological cues\nCertain sounds carry emotional connotation independently of meaning — a phenomenon known as *phonaesthesia*. Words with initial *sl-* (slime, slump) or final *-ump* (dump, clump) cluster around negative affect in English. In Spanish microblogging, analogous patterns emerge and can be captured with phonological embeddings.\n\n### Sociolinguistic markers\nUser communities develop their own lexical inventories. Slang terms, in-group references, and community-specific hashtags encode social identity alongside sentiment. Models that incorporate author-level features — posting frequency, follower graph position, historical sentiment trajectory — outperform purely text-based approaches on author profiling tasks.\n\n### Morphosyntactic patterns\nNegation scope, diminutives, and intensifiers modulate polarity in ways that surface-level token matching misses entirely. In agglutinative or morphologically rich languages (like Spanish), lemmatization and POS tagging before feature extraction significantly reduce noise.\n\n## Transformer models and their limits\n\nPre-trained language models (BERT, RoBERTa and their multilingual variants) have pushed state-of-the-art scores on benchmark emotion datasets substantially. Yet microblogging exposes their limitations:\n\n1. **Out-of-vocabulary tokens** — creative spelling and novel slang are rarely in pre-training corpora.\n2. **Short sequence sparsity** — attention mechanisms gain less from 20-word tweets than from paragraphs.\n3. **Domain shift** — a model fine-tuned on movie reviews behaves poorly on financial tweets.\n\nHybrid architectures that combine transformer encodings with handcrafted sociolinguistic features consistently outperform purely end-to-end neural approaches on Twitter benchmarks, including the PAN@CLEF author profiling tasks.\n\n## Practical implications\n\nUnderstanding emotional signals in microblogging has broad applications:\n\n- **Public health surveillance** — detecting early signs of depression or anxiety at population scale (eRisk@CLEF).\n- **Misinformation detection** — emotional arousal is a strong predictor of virality for false claims; polarity shifts in reply threads signal credibility disputes.\n- **Political analysis** — tracking sentiment toward candidates or policies in real time provides a complement to traditional polling.\n- **Hate speech and toxicity detection** — anger and disgust dimensions are the strongest predictors of abusive content, more so than keyword lists alone.\n\n## Looking ahead\n\nThe next frontier is **multimodal sentiment analysis**: combining text with audio prosody and facial expressions in video posts. Models that can align emotional signals across modalities will be essential as short-form video displaces text on social platforms.\n\nThe challenge of deciphering emotions in microblogging is ultimately a challenge of understanding human communication in its most compressed, contextual, and culturally embedded form — and that makes it one of the most intellectually rewarding problems in NLP.\n\n---\n\n*Edwin Puertas is an Associate Professor and NLP researcher at the Technological University of Bolívar, Cartagena, Colombia. He leads the VerbaNexAI research group, focusing on author profiling, sentiment analysis, and multimodal AI. IEEE Senior Member.*\n"])</script><script>self.__next_f.push([1,"a:[\"$\",\"$L7\",null,{\"columns\":\"2\",\"s\":{\"columns\":1},\"fillWidth\":true,\"marginBottom\":\"40\",\"gap\":\"16\",\"children\":[[\"$\",\"$L8\",\"beyond-words-emotions-polarity\",{\"post\":{\"metadata\":{\"title\":\"Beyond Words: Deciphering Emotio
