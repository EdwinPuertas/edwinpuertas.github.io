rg/10.1016/j.dib.2025.111284](https://doi.org/10.1016/j.dib.2025.111284)\n\n**Cuadrado, J., Martinez, E., Morillo, A., Peña, D., Sossa, K., Martinez-Santos, J. C., \u0026 Puertas, E. (2023).** UTB-NLP at SemEval-2023 Task 3: Weirdness, lexical features for detecting categorical framings, and persuasion in online news. In *Proceedings of SemEval-2023* (pp. 1551–1557). ACL. [https://doi.org/10.18653/v1/2023.semeval-1.214](https://doi.org/10.18653/v1/2023.semeval-1.214)\n\n**Cuadrado, J., Martinez, E., Cuadrado, J., Martinez-Santos, J. C., \u0026 Puertas, E. (2024).** VerbaNex AI at DIPROMATS 2024: Enhancing propaganda detection in diplomatic tweets with fine-tuned BERT and integrated NLP techniques. *CEUR Workshop Proceedings*, 3756.\n"])</script><script>self.__next_f.push([1,"23:[\"$\",\"$L21\",\"framelens\",{\"priority\":true,\"href\":\"/work/framelens\",\"images\":[],\"title\":\"FrameLens\",\"description\":\"FrameLens is a methodology using natural language processing (NLP) to analyze how news is framed in Spanish media.\",\"content\":\"$28\",\"avatars\":[{\"src\":\"/images/avatar.jpg\"}],\"link\":\"\"}]\n29:T6cd,"])</script><script>self.__next_f.push([1,"\nTrueShield is a platform designed to combat the spread of fake news by analyzing and verifying the reliability of user-submitted information. Using a structured process, it identifies key entities, cross-references data from sources like RSS, Twitter, and Reddit, and generates a veracity score based on advanced algorithms. Built on a scalable microservices architecture, it features a client interface in Angular, a Django backend, and FastAPI-powered APIs integrated with AI models from Hugging Face for tasks such as entity recognition and inference analysis. Deployed using modern tools like Docker, Terraform, and Ansible on AWS, TrueShield empowers users to evaluate the authenticity of information, fostering a transparent and trustworthy digital ecosystem.\n\n**Start:** March 2024 — **Status:** Active\n\n---\n\n#
